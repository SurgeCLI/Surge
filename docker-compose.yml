services:
  surge:
    build: .
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      - prometheus
  
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
  
  node-exporter:
    image: prom/node-exporter:latest

volumes:
  prometheus_data: